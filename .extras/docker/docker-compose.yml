# Optional production-style stack (Postgres + MinIO + backend + frontend). Not needed for local dev.
# Run from the repo root:  docker compose --env-file .env -f .extras/docker/docker-compose.yml up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: hr_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../.extras/docker/Dockerfile.backend
    container_name: hr_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://hr_user:${POSTGRES_PASSWORD}@postgres:5432/hr_db
      - SYNC_DATABASE_URL=postgresql://hr_user:${POSTGRES_PASSWORD}@postgres:5432/hr_db
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX=${PINECONE_INDEX:-people-ops-policies}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=hr-documents
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
      - LANGFUSE_WEBHOOK_SECRET=${LANGFUSE_WEBHOOK_SECRET:?set LANGFUSE_WEBHOOK_SECRET in .env}
      - MOCK_SSO_ENABLED=${MOCK_SSO_ENABLED:-false}
      - MOCK_LLM_ENABLED=${MOCK_LLM_ENABLED:-false}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../.extras/docker/Dockerfile.frontend
    container_name: hr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  minio_data:
