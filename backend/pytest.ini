[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
env =
    ENVIRONMENT=testing
    DATABASE_URL=sqlite+aiosqlite:///./test_hr.db
    SYNC_DATABASE_URL=sqlite:///./test_hr.db
    MOCK_SSO_ENABLED=true
    MOCK_LLM_ENABLED=true
