[project]
name = "hr-multiagent-platform-backend"
version = "1.0.0"
description = "Enterprise HR Platform with Google ADK Multi-Agent Architecture and NVIDIA NeMo Guardrails"
authors = [{ name = "Devansh Tyagi" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "nemoguardrails>=0.8.0",
    "google-genai>=0.1.0",
    "langsmith>=0.1.30",
    "neo4j>=5.18.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-env>=1.1.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
