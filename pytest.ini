[pytest]
testpaths = tests
pythonpath = backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    live_llm: needs a real LLM provider (set RUN_LIVE_LLM_TESTS=1 and MOCK_LLM_ENABLED=false)
env =
    ENVIRONMENT=testing
    DATABASE_URL=sqlite+aiosqlite:///./test_hr.db
    SYNC_DATABASE_URL=sqlite:///./test_hr.db
    MOCK_SSO_ENABLED=true
    PINECONE_API_KEY=
    D:MOCK_LLM_ENABLED=true
